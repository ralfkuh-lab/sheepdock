# kitty profile used only by the herdr launcher (herdr.app).
#
# Activated through KITTY_CONFIG_DIRECTORY, so it never affects kitty windows
# you start yourself. The Dock icon comes from the app bundle, not from here —
# deliberately: dropping a kitty.app.icns in a config directory makes kitty
# write the icon onto kitty.app itself, which would change it globally.

# Inherit your normal kitty configuration, if you have one.
# globinclude (not include) so a missing file is not an error. The pattern must
# be RELATIVE to this directory — kitty rejects absolute paths and ~ here.
globinclude ../kitty/kitty.conf

# Closing the herdr window should quit the app rather than leave it running.
macos_quit_when_last_window_closed yes
